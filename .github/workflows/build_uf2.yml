# GitHub Actions - build del .uf2 3.0 con fuentes congeladas
# Colocar en el repo como: .github/workflows/build_uf2.yml
# iter1 (21/09): version fijada v1.29.0, placa PICO_MP30, ARM tools,
# submodules recursive, manifest anclado (ver comentarios historicos).
# iter2 (22/09): copia 14 fuentes al directorio de la placa y el
# artifact pasa a llamarse firmware-3.0-iter2.

name: build-uf2-3.0

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Codigo ModuProbe 3.0
        uses: actions/checkout@v4

      - name: MicroPython (version = la de tu Pico, ver FU-B0)
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.29.0          # fijado con FU-B0 (iter1)
          path: mp
          submodules: recursive # pico-sdk y compania

      - name: Preparar placa PICO_MP30 con fuentes congeladas
        run: |
          cp -r mp/ports/rp2/boards/RPI_PICO mp/ports/rp2/boards/PICO_MP30
          cp device/buttons_pio.py device/fonts.py device/fpsmeter.py \
             device/gpu.py device/log.py device/screens.py \
             device/sd_browse.py device/sdcard.py device/services.py \
             device/st7567.py device/fontbase3.py device/fontnokia3.py \
             device/fontarcade3.py device/writer3.py \
             mp/ports/rp2/boards/PICO_MP30/
          cp build/manifest.py mp/ports/rp2/boards/PICO_MP30/manifest.py
          printf '\nset(MICROPY_FROZEN_MANIFEST ${MICROPY_BOARD_DIR}/manifest.py)\n' \
            >> mp/ports/rp2/boards/PICO_MP30/mpconfigboard.cmake

      - name: Herramientas ARM (compilador cruzado)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Compilar
        run: |
          cd mp
          make -C mpy-cross -j2
          make -C ports/rp2 BOARD=PICO_MP30 -j2

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: firmware-3.0-iter2
          path: mp/ports/rp2/build*/firmware.uf2
