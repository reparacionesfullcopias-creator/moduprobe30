# GitHub Actions — build del .uf2 3.0 con fuentes congeladas (FASE B)
# Colocar en el repo como: .github/workflows/build_uf2.yml
# Version de MicroPython FIJADA con FU-B0 (sonda FUB, 21/09): v1.29.0.
# 21/09: anadido paso de herramientas ARM (el runner de GitHub no trae
# gcc-arm-none-eabi preinstalado, verificado en el readme de runner-images).
# 21/09: adaptado a v1.29.0 real: placa renombrada PICO -> RPI_PICO,
# manifest anclado con set() (sintaxis CMake oficial de esa version) y
# submodules recursive (rp2 necesita lib/pico-sdk para compilar).

name: build-uf2-3.0

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Codigo ModuProbe 3.0
        uses: actions/checkout@v4

      - name: MicroPython (version = la de tu Pico, ver FU-B0)
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.29.0          # fijado con FU-B0 (MicroPython v1.29.0, 21/09)
          path: mp
          submodules: recursive # pico-sdk y compania: sin esto rp2 no compila

      - name: Preparar placa PICO_MP30 con fuentes congeladas
        run: |
          cp -r mp/ports/rp2/boards/RPI_PICO mp/ports/rp2/boards/PICO_MP30
          cp device/fontbase3.py device/fontnokia3.py \
             device/fontarcade3.py device/writer3.py \
             mp/ports/rp2/boards/PICO_MP30/
          cp build/manifest.py mp/ports/rp2/boards/PICO_MP30/manifest.py
          # Anclar el manifest en la placa (linea anadida al final de
          # PICO_MP30/mpconfigboard.cmake). Sintaxis CMake oficial de
          # v1.29.0 (la usan RPI_PICO_W y otras placas con frozen propio):
          printf '\nset(MICROPY_FROZEN_MANIFEST ${MICROPY_BOARD_DIR}/manifest.py)\n' \
            >> mp/ports/rp2/boards/PICO_MP30/mpconfigboard.cmake

      - name: Herramientas ARM (compilador cruzado)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Compilar
        run: |
          cd mp
          make -C mpy-cross -j2
          make -C ports/rp2 BOARD=PICO_MP30 -j2

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: firmware-3.0-iter1
          path: mp/ports/rp2/build*/firmware.uf2
